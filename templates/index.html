{% extends 'base.html' %}

{% block content %}
    <h1>{% block title %} Messages {% endblock %}</h1>
    {% for message in messages %}
        <div class='message'>
            <h2>{{ message.title }}</h2>
            <em>Written by: {{ message.author.name }}</em>
            <p>{{ message.content }}</p>
        </div>
    {% endfor %}
{% endblock %}
